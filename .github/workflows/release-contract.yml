name: Release contract

on:
  pull_request:
    paths:
      - "RELEASE_NOTES.md"
      - "RELEASE.md"
      - "release-platforms.json"
      - "zapstore.yaml"
      - "packaging/homebrew/**"
      - "scripts/distribute"
      - "scripts/distribution_common.sh"
      - "scripts/release-manifest.py"
      - "scripts/ios_adhoc_prepare.py"
      - "scripts/test_ios_adhoc_prepare.py"
      - "scripts/ios_ordinary_relaunch.py"
      - "scripts/qualify_ios_ordinary_relaunch.py"
      - "scripts/test_ios_ordinary_relaunch.py"
      - "scripts/ios_relaunch_adapters.py"
      - "scripts/test_ios_relaunch_adapters.py"
      - "scripts/ios_relaunch_lifecycle.py"
      - "scripts/test_ios_relaunch_lifecycle.py"
      - "scripts/ios_quality_observer.py"
      - "scripts/ios_quality_trace.py"
      - "scripts/qualify_ios_quality_observer.py"
      - "scripts/test_ios_quality_observer.py"
      - "scripts/ios_runtime_acceptance.py"
      - "scripts/test_ios_runtime_acceptance.py"
      - "scripts/test_ios_runtime_workflow.py"
      - "scripts/check-release-updater.py"
      - "scripts/render-release-notes.py"
      - "scripts/test_release_*.py"
      - "scripts/release_input_checks.py"
      - ".github/workflows/release-contract.yml"
      - "scripts/release-build-inputs.*"
      - "global.json"
      - "linux/Dockerfile"
      - "linux/build-inputs/**"
      - "linux/scripts/**"
      - "scripts/docker_stage_common.sh"
      - "scripts/cli-release"
      - "scripts/linux-release"
      - "scripts/test_cli_install_docker"
      - "scripts/windows-build-local.ps1"
      - "scripts/ios-build"
      - "scripts/macos-build"
      - "scripts/android-dependency-phase*"
      - "scripts/android-release-inputs.*"
      - "scripts/test_android_dependency_inputs.py"
      - "scripts/test_android_release_inputs.py"
      - "scripts/android_upgrade_*.py"
      - "scripts/android_saved_history.py"
      - "scripts/check_android_upgrade_receipt.py"
      - "scripts/test_android_release_upgrade.py"
      - "scripts/test_android_upgrade_harness.py"
      - "test-fixtures/android-upgrade/**"
      - "scripts/android_runtime_smoke.py"
      - "scripts/test_android_runtime_smoke.py"
      - "scripts/test_native_contract.sh"
      - "scripts/test_release_publish_guard"
      - ".github/workflows/build-artifacts.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/ios-distribution.yml"
      - ".github/workflows/ios-runtime-acceptance.yml"
  push:
    branches:
      - main
    paths:
      - "RELEASE_NOTES.md"
      - "RELEASE.md"
      - "release-platforms.json"
      - "zapstore.yaml"
      - "packaging/homebrew/**"
      - "scripts/distribute"
      - "scripts/distribution_common.sh"
      - "scripts/release-manifest.py"
      - "scripts/ios_adhoc_prepare.py"
      - "scripts/test_ios_adhoc_prepare.py"
      - "scripts/ios_ordinary_relaunch.py"
      - "scripts/qualify_ios_ordinary_relaunch.py"
      - "scripts/test_ios_ordinary_relaunch.py"
      - "scripts/ios_relaunch_adapters.py"
      - "scripts/test_ios_relaunch_adapters.py"
      - "scripts/ios_relaunch_lifecycle.py"
      - "scripts/test_ios_relaunch_lifecycle.py"
      - "scripts/ios_quality_observer.py"
      - "scripts/ios_quality_trace.py"
      - "scripts/qualify_ios_quality_observer.py"
      - "scripts/test_ios_quality_observer.py"
      - "scripts/ios_runtime_acceptance.py"
      - "scripts/test_ios_runtime_acceptance.py"
      - "scripts/test_ios_runtime_workflow.py"
      - "scripts/check-release-updater.py"
      - "scripts/render-release-notes.py"
      - "scripts/test_release_*.py"
      - "scripts/release_input_checks.py"
      - ".github/workflows/release-contract.yml"
      - "scripts/release-build-inputs.*"
      - "global.json"
      - "linux/Dockerfile"
      - "linux/build-inputs/**"
      - "linux/scripts/**"
      - "scripts/docker_stage_common.sh"
      - "scripts/cli-release"
      - "scripts/linux-release"
      - "scripts/test_cli_install_docker"
      - "scripts/windows-build-local.ps1"
      - "scripts/ios-build"
      - "scripts/macos-build"
      - "scripts/android-dependency-phase*"
      - "scripts/android-release-inputs.*"
      - "scripts/test_android_dependency_inputs.py"
      - "scripts/test_android_release_inputs.py"
      - "scripts/android_upgrade_*.py"
      - "scripts/android_saved_history.py"
      - "scripts/check_android_upgrade_receipt.py"
      - "scripts/test_android_release_upgrade.py"
      - "scripts/test_android_upgrade_harness.py"
      - "test-fixtures/android-upgrade/**"
      - "scripts/android_runtime_smoke.py"
      - "scripts/test_android_runtime_smoke.py"
      - "scripts/test_native_contract.sh"
      - "scripts/test_release_publish_guard"
      - ".github/workflows/build-artifacts.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/ios-distribution.yml"
      - ".github/workflows/ios-runtime-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release system
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate notes, manifests, workflows, and packaging
        run: |
          scripts/render-release-notes.py \
            --channel validate \
            --notes RELEASE_NOTES.md
          scripts/test_release_publish_guard
          scripts/test_homebrew_tap
