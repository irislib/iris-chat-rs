name: iOS UI runner

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact source for the UI test runner (no app or Rust build)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-ui-runner-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  runner:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      SOURCE_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: Build only the unsigned UI test runner
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 scripts/prepare_ios_ui_runner.py
          xcodegen generate --spec work/ios-ui-runner/project.yml
          xcodebuild -project work/ios-ui-runner/IrisChatUIRunner.xcodeproj \
            -scheme IrisChatUITests -destination 'generic/platform=iOS' \
            -configuration Debug -derivedDataPath work/ios-ui-runner/DerivedData \
            -jobs 2 ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO build-for-testing
          python3 scripts/prepare_ios_ui_runner.py --receipt
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ui-runner-${{ inputs.commit }}
          path: |
            work/ios-ui-runner/ios-ui-runner.tar.gz
            work/ios-ui-runner/build-receipt.json
          if-no-files-found: error
          retention-days: 7
