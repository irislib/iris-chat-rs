name: Build isolated updater diagnostics

on:
  workflow_dispatch:
  push:
    branches: [codex/updater-hosted-diagnostics]

permissions:
  contents: read

concurrency:
  group: updater-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Only an existing public repository's standard hosted runner. No paid sizes.
    if: github.event.repository.private == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - role: client
            runner: ubuntu-22.04
          - role: provider
            runner: macos-15
    steps:
      - name: Read diagnostic inputs only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Use Python with TOML and safe archive support
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libdbus-1-dev pkg-config libssl-dev
      - name: Check Mac compiler prerequisites
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          xcrun --find clang
          command -v cmake
          command -v pkg-config
      - name: Select fixed Rust compiler
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup default 1.93.1
      - name: Verify public input hashes and build safeguards
        run: |
          python3 diagnostic/build.py --verify-only
          python3 -m unittest discover -s diagnostic -p 'test_build.py' -v
      - name: Build exact-version observation-only binary
        run: python3 diagnostic/build.py --role '${{ matrix.role }}' --root "$RUNNER_TEMP/updater-${{ matrix.role }}"
      - name: Preserve bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.role }}-DIAGNOSTIC-${{ github.run_id }}
          path: ${{ runner.temp }}/updater-${{ matrix.role }}/output/
          retention-days: 3
          if-no-files-found: ignore
