name: CI

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-checks.yml"
      - "scripts/test_release_workflow.py"
      - "scripts/apple_connect_api.py"
      - "scripts/test_apple_connect_api.py"
      - "scripts/run_public_link_phone.py"
      - "scripts/test_ios_harness_retry_contract.py"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-checks.yml"
      - "scripts/test_release_workflow.py"
      - "scripts/apple_connect_api.py"
      - "scripts/test_apple_connect_api.py"
      - "scripts/run_public_link_phone.py"
      - "scripts/test_ios_harness_retry_contract.py"
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run; retain exact source-bound coverage for unchanged components
        type: choice
        default: all
        options: [all, cli, core, protocol, android, windows, windows-keyboard, windows-restore, apple, ios, ios-unit, macos, linux, apple-products, ios-products, macos-products, ios-ui-runner, macos-ui-runner, rust-focused, rust-package]
      ios_core_seed_run:
        description: Optional exact successful core build/cache producer for Swift-only unit validation
        type: string
        default: ''
      focused_crate:
        description: Library to test with rust-focused scope
        type: choice
        default: core
        options: [core, chat-protocol, protocol-ffi]
      focused_tests:
        description: Whitespace-separated exact Rust test names for rust-focused scope
        type: string
        default: ''
      focused_release:
        description: Use the release profile for rust-focused scope
        type: boolean
        default: false
      focused_ignored:
        description: Execute selected ignored tests in rust-focused scope
        type: boolean
        default: false
      package_crate:
        description: Crate to verify with rust-package scope; publish protocol before verifying core
        type: choice
        default: chat-protocol
        options: [core, chat-protocol]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.scope || 'all' }}-${{ inputs.ios_core_seed_run || 'full' }}${{ inputs.scope == 'rust-focused' && format('-{0}-{1}', inputs.focused_crate, inputs.focused_release) || inputs.scope == 'rust-package' && format('-{0}', inputs.package_crate) || '' }}
  cancel-in-progress: true

env:
  APP_DIR: iris-chat-rs
  CARGO_TERM_COLOR: always

jobs:
  windows-restore:
    if: ${{ inputs.scope == 'windows-restore' }}
    name: Windows restore with isolated release SDK
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install only the checksum-verified release SDK
        shell: python
        run: |
          import importlib.util, json, os, re, shutil, subprocess
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('inputs', 'scripts/release-build-inputs.py')
          inputs = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(inputs)
          inputs.require(os.environ.get('GITHUB_ACTIONS') == 'true' and os.environ.get('RUNNER_OS') == 'Windows', 'Hosted Windows runner required')
          inputs.require(inputs.checkout_commit() == os.environ['GITHUB_SHA'], 'Checkout differs from selected source')
          pins = json.loads(inputs.PINS.read_text())
          inputs.check_native_pins(pins)
          pin = pins['tools']['dotnet']
          work = Path(os.environ['RUNNER_TEMP']) / 'iris-windows-restore'
          inputs.require(shutil.disk_usage(work.parent).free >= 4 * 1024**3, 'Insufficient space for isolated SDK restore')
          work.mkdir(exist_ok=False)
          archive = inputs.download_native(pin, work / 'dotnet-sdk.zip')
          binary = inputs.unpack_native(archive, pin, work / 'dotnet')
          nuget_config = work / 'NuGet.Config'
          nuget_config.write_text('<configuration><packageSources><clear/><add key="nuget.org" value="https://api.nuget.org/v3/index.json"/></packageSources><fallbackPackageFolders><clear/></fallbackPackageFolders></configuration>\n')
          exports = {'DOTNET_ROOT': str(binary.parent), 'DOTNET_MULTILEVEL_LOOKUP': '0',
                     'DOTNET_SKIP_FIRST_TIME_EXPERIENCE': '1', 'DOTNET_CLI_TELEMETRY_OPTOUT': '1',
                     'DOTNET_CLI_HOME': str(work / 'home'), 'DOTNET_PROCESSOR_COUNT': '2',
                     'NUGET_PACKAGES': str(work / 'packages'), 'NUGET_HTTP_CACHE_PATH': str(work / 'http-cache'),
                     'RestoreConfigFile': str(nuget_config)}
          version = subprocess.check_output([str(binary), '--version'], env={**os.environ, **exports}, text=True, timeout=30).strip()
          inputs.require(re.search(pin['version_pattern'], version) is not None, 'Installed SDK version mismatch')
          (work / 'receipt.json').write_text(json.dumps({'source': inputs.checkout_commit(), 'input': pin, 'version': version,
              'installerSHA256': inputs.digest(Path('scripts/release-build-inputs.py')),
              'pinsSHA256': inputs.digest(inputs.PINS), 'nugetConfigSHA256': inputs.digest(nuget_config)}, indent=2) + '\n')
          with open(os.environ['GITHUB_PATH'], 'a') as stream:
              stream.write(str(binary.parent) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              for key, value in exports.items():
                  stream.write(key + '=' + value + '\n')
      - name: Evaluate and test locked Windows restore
        shell: pwsh
        run: ./scripts/test-windows-restore.ps1 -SdkVersion '10.0.402' -RequireColdReferencePacks -OutputDirectory 'work/windows-restore-10.0.402'
      - name: Retain restore evaluation and original outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-restore-10.0.402
          path: |
            work/windows-restore-10.0.402/
            ${{ runner.temp }}/iris-windows-restore/receipt.json
          retention-days: 14

  apple-validation-products:
    if: ${{ inputs.scope == 'apple-products' || inputs.scope == 'ios-products' || inputs.scope == 'macos-products' || inputs.scope == 'ios-ui-runner' || inputs.scope == 'macos-ui-runner' }}
    uses: ./.github/workflows/apple-validation-products.yml
    with:
      commit: ${{ github.sha }}
      platform: ${{ inputs.scope == 'macos-ui-runner' && 'macos-ui' || inputs.scope == 'ios-ui-runner' && 'ios-ui' || inputs.scope == 'ios-products' && 'ios' || inputs.scope == 'macos-products' && 'macos' || 'both' }}

  rust-focused:
    if: ${{ inputs.scope == 'rust-focused' }}
    name: Focused Rust regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
      FOCUSED_CRATE: ${{ inputs.focused_crate }}
      FOCUSED_TESTS: ${{ inputs.focused_tests }}
      FOCUSED_RELEASE: ${{ inputs.focused_release }}
      FOCUSED_IGNORED: ${{ inputs.focused_ignored }}
    defaults:
      run:
        working-directory: iris-chat-rs
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_DIR }}
          ref: ${{ github.sha }}

      - name: Validate runner and selected tests without compiling
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/test_rust_focused.py
          flags=()
          if [[ "$FOCUSED_RELEASE" == true ]]; then flags+=(--release); fi
          if [[ "$FOCUSED_IGNORED" == true ]]; then flags+=(--include-ignored); fi
          mkdir -p work/rust-focused
          python3 scripts/test-rust-focused --crate "$FOCUSED_CRATE" --tests "$FOCUSED_TESTS" \
            --online --timeout 600 --output work/rust-focused/run "${flags[@]}" --dry-run \
            > work/rust-focused/plan.json
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          record = {key: os.environ[key] for key in ("GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_WORKFLOW_REF", "GITHUB_WORKFLOW_SHA")}
          record["checked_out_commit"] = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          pathlib.Path("work/rust-focused/ci-source.json").write_text(json.dumps(record, indent=2) + "\n")
          PY

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Install Rust and identify compiler cache
        id: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          echo "identity=$(rustc -Vv | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore focused compiler cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: rust-focused-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ inputs.focused_crate }}-${{ inputs.focused_release && 'release' || 'debug' }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-focused-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ inputs.focused_crate }}-${{ inputs.focused_release && 'release' || 'debug' }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock') }}-
            rust-focused-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-
            rust-${{ runner.os }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock') }}
            rust-${{ runner.os }}-

      - name: Build once and run exact tests
        id: focused
        run: |
          set -Eeuo pipefail
          flags=()
          if [[ "$FOCUSED_RELEASE" == true ]]; then flags+=(--release); fi
          if [[ "$FOCUSED_IGNORED" == true ]]; then flags+=(--include-ignored); fi
          python3 scripts/test-rust-focused --crate "$FOCUSED_CRATE" --tests "$FOCUSED_TESTS" \
            --online --timeout 600 --output work/rust-focused/run "${flags[@]}"

      - name: Preserve compiled dependencies after test failure
        if: ${{ !cancelled() && (steps.focused.outcome == 'success' || steps.focused.outcome == 'failure') && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Retain full focused test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-focused-${{ inputs.focused_crate }}
          path: iris-chat-rs/work/rust-focused/
          if-no-files-found: warn
          retention-days: 14

  rust-package:
    if: ${{ inputs.scope == 'rust-package' }}
    name: Verify Rust package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
      CARGO_BUILD_JOBS: '2'
      PACKAGE_CRATE: ${{ inputs.package_crate }}
    defaults:
      run:
        working-directory: iris-chat-rs
    steps:
      - name: Checkout selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.APP_DIR }}
          ref: ${{ github.sha }}

      - name: Record selected package source
        run: |
          set -Eeuo pipefail
          case "$PACKAGE_CRATE" in core|chat-protocol) ;; *) exit 2 ;; esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p work/rust-package
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          record = {key: os.environ[key] for key in ("GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_WORKFLOW_REF", "GITHUB_WORKFLOW_SHA", "CARGO_TARGET_DIR", "CARGO_BUILD_JOBS", "PACKAGE_CRATE")}
          record["checked_out_commit"] = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          record["command"] = ["cargo", "package", "--manifest-path", os.environ["PACKAGE_CRATE"] + "/Cargo.toml", "--locked"]
          pathlib.Path("work/rust-package/ci-source.json").write_text(json.dumps(record, indent=2) + "\n")
          PY
          git ls-files -z -- "$PACKAGE_CRATE" chat-protocol .cargo .github/workflows/ci.yml \
            scripts/release-build-inputs.py scripts/release-build-inputs.json \
            linux/scripts/pinned-apt.sh linux/build-inputs/apt-snapshots.tsv |
            xargs -0 sha256sum > work/rust-package/source-sha256.txt

      - name: Install checksum-verified package compiler
        run: python3 scripts/release-build-inputs.py --install --work "$RUNNER_TEMP/iris-package-rust"

      - name: Retain reviewed package compiler inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-build-inputs-${{ inputs.package_crate }}
          path: ${{ runner.temp }}/iris-package-rust/receipt.json
          if-no-files-found: warn
          retention-days: 14

      - name: Install package dependencies and identify compiler cache
        id: toolchain
        run: |
          set -Eeuo pipefail
          sudo bash linux/scripts/pinned-apt.sh ubuntu-noble cmake libdbus-1-dev pkg-config pkgconf pkgconf-bin
          echo "CMAKE=/usr/bin/cmake" >> "$GITHUB_ENV"
          echo "PKG_CONFIG=/usr/bin/pkg-config" >> "$GITHUB_ENV"
          rustc -Vv | tee work/rust-package/rustc.txt
          cargo -V | tee work/rust-package/cargo.txt
          echo "identity=$(sha256sum work/rust-package/rustc.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore package compiler cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: rust-package-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('iris-chat-rs/scripts/release-build-inputs.py', 'iris-chat-rs/scripts/release-build-inputs.json', 'iris-chat-rs/linux/scripts/pinned-apt.sh', 'iris-chat-rs/linux/build-inputs/apt-snapshots.tsv') }}-${{ inputs.package_crate }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-package-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('iris-chat-rs/scripts/release-build-inputs.py', 'iris-chat-rs/scripts/release-build-inputs.json', 'iris-chat-rs/linux/scripts/pinned-apt.sh', 'iris-chat-rs/linux/build-inputs/apt-snapshots.tsv') }}-${{ inputs.package_crate }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock') }}-
            rust-package-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('iris-chat-rs/scripts/release-build-inputs.py', 'iris-chat-rs/scripts/release-build-inputs.json', 'iris-chat-rs/linux/scripts/pinned-apt.sh', 'iris-chat-rs/linux/build-inputs/apt-snapshots.tsv') }}-${{ inputs.package_crate }}-
            rust-package-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('iris-chat-rs/scripts/release-build-inputs.py', 'iris-chat-rs/scripts/release-build-inputs.json', 'iris-chat-rs/linux/scripts/pinned-apt.sh', 'iris-chat-rs/linux/build-inputs/apt-snapshots.tsv') }}-

      - name: Verify selected package without publishing
        id: package
        run: |
          set -Eeuo pipefail
          status=0
          timeout --signal=TERM --kill-after=10s 15m \
            cargo package --manifest-path "$PACKAGE_CRATE/Cargo.toml" --locked 2>&1 |
            tee work/rust-package/package.log || status=$?
          printf '{"pipeline_exit_code":%s}\n' "$status" > work/rust-package/result.json
          if (( status != 0 )); then exit "$status"; fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum --check --status work/rust-package/source-sha256.txt
          archive="$(python3 - <<'PY'
          import os, pathlib, tomllib
          package = tomllib.loads(pathlib.Path(os.environ["PACKAGE_CRATE"], "Cargo.toml").read_text())["package"]
          print(package["name"] + "-" + package["version"] + ".crate")
          PY
          )"
          test -s "$CARGO_TARGET_DIR/package/$archive"
          sha256sum "$CARGO_TARGET_DIR/package/$archive" > work/rust-package/package.sha256
          echo "archive=$CARGO_TARGET_DIR/package/$archive" >> "$GITHUB_OUTPUT"

      - name: Preserve compiled package dependencies after failure
        if: ${{ !cancelled() && (steps.package.outcome == 'success' || steps.package.outcome == 'failure') && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Upload verified selected package
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-${{ inputs.package_crate }}-package
          path: |
            ${{ steps.package.outputs.archive }}
            iris-chat-rs/work/rust-package/package.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Retain full package verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-package-${{ inputs.package_crate }}
          path: iris-chat-rs/work/rust-package/
          if-no-files-found: warn
          retention-days: 14

  rust:
    if: ${{ inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'core' || inputs.scope == 'protocol' }}
    name: Rust and repo checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
      RELEASE_CACHE_TRUSTED: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.scope != 'protocol' }}
    defaults:
      run:
        working-directory: iris-chat-rs
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.APP_DIR }}

      - name: Install checksum-verified release compiler
        if: env.RELEASE_CACHE_TRUSTED == 'true'
        run: python3 scripts/release-build-inputs.py --install --work "$RUNNER_TEMP/iris-release-rust" --component rustfmt --component clippy

      - name: Install native dependencies and identify compiler
        if: env.RELEASE_CACHE_TRUSTED == 'true'
        id: toolchain
        run: |
          set -Eeuo pipefail
          sudo bash linux/scripts/pinned-apt.sh ubuntu-noble cmake libdbus-1-dev pkg-config pkgconf pkgconf-bin
          echo "CMAKE=/usr/bin/cmake" >> "$GITHUB_ENV"
          echo "PKG_CONFIG=/usr/bin/pkg-config" >> "$GITHUB_ENV"
          echo "identity=$(rustc -Vv | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        if: env.RELEASE_CACHE_TRUSTED != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Install Rust
        if: env.RELEASE_CACHE_TRUSTED != 'true'
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Cache Cargo
        if: env.RELEASE_CACHE_TRUSTED != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: rust-${{ runner.os }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      # Main-scoped caches are visible to later tags; tag caches cannot cross tag refs.
      - name: Restore release compiler cache
        if: env.RELEASE_CACHE_TRUSTED == 'true'
        id: release-cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: rust-release-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('iris-chat-rs/scripts/release-build-inputs.py', 'iris-chat-rs/scripts/release-build-inputs.json', 'iris-chat-rs/linux/scripts/pinned-apt.sh', 'iris-chat-rs/linux/build-inputs/apt-snapshots.tsv') }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock') }}-${{ github.sha }}-complete
          restore-keys: |
            rust-release-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('iris-chat-rs/scripts/release-build-inputs.py', 'iris-chat-rs/scripts/release-build-inputs.json', 'iris-chat-rs/linux/scripts/pinned-apt.sh', 'iris-chat-rs/linux/build-inputs/apt-snapshots.tsv') }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock') }}-${{ github.sha }}-
            rust-release-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('iris-chat-rs/scripts/release-build-inputs.py', 'iris-chat-rs/scripts/release-build-inputs.json', 'iris-chat-rs/linux/scripts/pinned-apt.sh', 'iris-chat-rs/linux/build-inputs/apt-snapshots.tsv') }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock') }}-

      - name: Static checks
        run: |
          ./scripts/check-palettes
          ./scripts/check-no-accent-text
          ./scripts/check-source-file-sizes
          python3 scripts/test_dependency_lock_consistency.py
          python3 scripts/test_rust_focused.py
          python3 scripts/ci_release_cache_checks.py
          ./scripts/check-rust-panics
          ./scripts/test_release_publish_guard
          ./scripts/test_homebrew_tap

      - name: Rust formatting
        run: |
          cargo fmt --manifest-path chat-protocol/Cargo.toml -- --check
          cargo fmt --manifest-path core/Cargo.toml -- --check
          cargo fmt --manifest-path protocol-ffi/Cargo.toml -- --check
          cargo fmt --manifest-path linux/Cargo.toml -- --check

      - name: Rust lint including test targets
        env:
          VALIDATION_SCOPE: ${{ inputs.scope }}
        run: |
          crates=(core chat-protocol protocol-ffi)
          if [[ "$VALIDATION_SCOPE" == protocol ]]; then crates=(chat-protocol); fi
          for crate in "${crates[@]}"; do
            cargo clippy --manifest-path "$crate/Cargo.toml" --locked --all-targets -- -D warnings
          done

      - name: Rust tests
        if: inputs.scope != 'protocol'
        run: |
          mkdir -p work/private-controls
          IRIS_PRIVATE_CONTROL_FIXTURE_OUTPUT="$PWD/work/private-controls/native-private-controls.json" ./scripts/test_rust.sh
          test -s work/private-controls/native-private-controls.json
          git rev-parse HEAD > work/private-controls/source-commit.txt
          cd work/private-controls
          sha256sum native-private-controls.json > SHA256SUMS

      - name: Upload native private-control interoperability fixture
        if: inputs.scope != 'protocol'
        uses: actions/upload-artifact@v4
        with:
          name: native-private-control-fixture
          path: iris-chat-rs/work/private-controls/
          if-no-files-found: error
          retention-days: 14

      - name: Protocol tests
        if: inputs.scope == 'protocol'
        run: |
          set -Eeuo pipefail
          mkdir -p work/protocol-checks
          {
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'run_id=%s\nrun_attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } > work/protocol-checks/provenance.txt
          git ls-files -z chat-protocol scripts/test_rust.sh .github/workflows/ci.yml |
            xargs -0 sha256sum > work/protocol-checks/source-sha256.txt
          IRIS_PROTOCOL_TEST_OUTPUT_DIR="$PWD/work/protocol-checks" \
            ./scripts/test_rust.sh --protocol-only 2>&1 | tee work/protocol-checks/protocol-tests.log

      - name: Retain protocol test evidence
        if: ${{ always() && inputs.scope == 'protocol' }}
        uses: actions/upload-artifact@v4
        with:
          name: protocol-checks
          path: iris-chat-rs/work/protocol-checks/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify protocol package
        id: protocol-package
        run: |
          cargo package --manifest-path chat-protocol/Cargo.toml --locked
          protocol_version="$(python3 -c 'import tomllib; print(tomllib.load(open("chat-protocol/Cargo.toml", "rb"))["package"]["version"])')"
          protocol_archive="iris-chat-protocol-${protocol_version}.crate"
          cd "$CARGO_TARGET_DIR/package"
          sha256sum "$protocol_archive" > protocol-package.sha256
          echo "archive=$CARGO_TARGET_DIR/package/$protocol_archive" >> "$GITHUB_OUTPUT"

      - name: Upload verified protocol package
        uses: actions/upload-artifact@v4
        with:
          name: verified-protocol-package
          path: |
            ${{ steps.protocol-package.outputs.archive }}
            ${{ github.workspace }}/cargo-target/package/protocol-package.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Preserve release compiler cache after tests
        if: ${{ !cancelled() && env.RELEASE_CACHE_TRUSTED == 'true' && steps.release-cargo-cache.outcome == 'success' && steps.release-cargo-cache.outputs.cache-hit != 'true' && (job.status == 'success' || !endsWith(steps.release-cargo-cache.outputs.cache-matched-key, format('-{0}-partial', github.sha))) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: rust-release-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('iris-chat-rs/scripts/release-build-inputs.py', 'iris-chat-rs/scripts/release-build-inputs.json', 'iris-chat-rs/linux/scripts/pinned-apt.sh', 'iris-chat-rs/linux/build-inputs/apt-snapshots.tsv') }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock') }}-${{ github.sha }}-${{ job.status == 'success' && 'complete' || 'partial' }}

  android:
    if: ${{ inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'android' }}
    name: Android build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
    defaults:
      run:
        working-directory: iris-chat-rs
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_DIR }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Install Android SDK components
        run: |
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$android_sdk_root" ]]; then
            echo "ANDROID_HOME or ANDROID_SDK_ROOT must be set." >&2
            exit 1
          fi
          sdkmanager_bin="$android_sdk_root/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Cache Cargo and Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ github.workspace }}/cargo-target
          key: android-${{ runner.os }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock', 'iris-chat-rs/android/**/*.gradle*', 'iris-chat-rs/android/gradle/**/*.toml') }}
          restore-keys: |
            android-${{ runner.os }}-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Assemble debug APK
        run: ./scripts/android-build android-assemble

      - name: Android unit and compile checks
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebugAndroidTest -Piris.testRunner=to.iris.chat.calls.NativeCallTestRunner
        working-directory: iris-chat-rs/android

      - name: Upload Android native test packages
        uses: actions/upload-artifact@v4
        with:
          name: android-native-test-packages
          path: |
            iris-chat-rs/android/app/build/outputs/apk/debug/*.apk
            iris-chat-rs/android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  linux:
    if: ${{ inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'linux' }}
    name: Linux build and tests (Rust ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, '1.93.1']
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
    defaults:
      run:
        working-directory: iris-chat-rs
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_DIR }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            adwaita-icon-theme \
            build-essential \
            libadwaita-1-dev \
            libclang-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libgtk-4-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav gstreamer1.0-pipewire \
            libsecret-1-dev \
            librsvg2-common \
            libsoup-3.0-dev \
            libssl-dev \
            libv4l-dev libasound2-dev nasm \
            xvfb xauth dbus-x11 \
            pkg-config

      - name: Install Rust
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component clippy
          rustup default "${{ matrix.toolchain }}"

      - name: Cache Cargo
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: linux-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            linux-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock') }}-
            linux-${{ runner.os }}-${{ matrix.toolchain }}-

      - name: Desktop media regression tests
        run: |
          cargo clippy --manifest-path core/Cargo.toml --features desktop-media --locked --lib -- -D warnings -D clippy::panic -D clippy::unwrap_used -D clippy::expect_used -D clippy::unimplemented -D clippy::todo -D clippy::indexing_slicing
          cargo test --manifest-path core/Cargo.toml --features desktop-media --locked --lib desktop_call -- --nocapture

      - name: Linux tests
        run: |
          mkdir -p work/clipboard
          IRIS_CLIPBOARD_UI_SCREENSHOT="$PWD/work/clipboard/linux.png" \
          IRIS_COMPLETION_SCREENSHOT_DIR="$PWD/work/clipboard/completion" \
          IRIS_KEYBOARD_SCREENSHOT="$PWD/work/clipboard/linux-keyboard.png" \
            dbus-run-session -- xvfb-run -a cargo test --manifest-path linux/Cargo.toml --locked --features ui-tests

      - name: Upload Linux clipboard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-clipboard-tests-${{ matrix.toolchain }}
          path: iris-chat-rs/work/clipboard/
          retention-days: 14

      - name: Retain compiled dependencies after test failures
        if: ${{ always() && !cancelled() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  macos:
    if: ${{ inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'apple' || inputs.scope == 'macos' }}
    name: macOS build and tests
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
    defaults:
      run:
        working-directory: iris-chat-rs
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_DIR }}

      - name: Install build tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
            ${{ github.workspace }}/iris-chat-rs/macos/.build/cargo-target
          key: macos-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock', 'iris-chat-rs/macos/project.yml') }}
          restore-keys: |
            macos-${{ runner.os }}-${{ runner.arch }}-

      - name: macOS tests
        run: ./scripts/test-macos

      - name: Upload macOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-composer-tests
          path: iris-chat-rs/macos/.build/DerivedData/Logs/Test/*.xcresult
          include-hidden-files: true
          retention-days: 14

  ios:
    if: ${{ inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'apple' || inputs.scope == 'ios' || inputs.scope == 'ios-unit' }}
    name: iOS simulator build and composer tests
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
    defaults:
      run:
        working-directory: iris-chat-rs
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_DIR }}

      - name: Install build tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Restore Cargo cache
        id: ios_cargo_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock', 'iris-chat-rs/ios/project.yml') }}
          restore-keys: |
            ios-${{ runner.os }}-${{ runner.arch }}-

      - name: iOS simulator build
        id: ios-build
        env:
          GH_TOKEN: ${{ github.token }}
          IOS_CORE_SEED_RUN: ${{ inputs.ios_core_seed_run }}
          IOS_CORE_CACHE_HIT: ${{ steps.ios_cargo_cache.outputs.cache-hit }}
          IOS_CORE_CACHE_KEY: ${{ steps.ios_cargo_cache.outputs.cache-primary-key }}
        run: |
          if [[ -n "$IOS_CORE_SEED_RUN" ]]; then
            test "${{ inputs.scope }}" = ios-unit
            python3 scripts/reuse_ios_core_cache.py --producer-run "$IOS_CORE_SEED_RUN"
            source scripts/build_common.sh
            load_release_env "$PWD"
            resolve_shared_build_metadata "$PWD"
            IRIS_IOS_NOTIFICATION_DEBUG_SIGNING_STYLE=Automatic \
              IRIS_IOS_NOTIFICATION_DEBUG_PROFILE_SPECIFIER= \
              sh -c 'cd ios && xcodegen generate --spec project.yml'
            xcodebuild -project ios/IrisChat.xcodeproj -scheme IrisChat \
              -destination "$(./scripts/ios-simulator-destination)" -jobs 2 build
          else
            ./scripts/ios-build ios-build-sim
          fi

      - name: Save successful iOS compiler cache
        if: steps.ios_cargo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: ${{ steps.ios_cargo_cache.outputs.cache-primary-key }}

      - name: iOS device linking progress test
        if: inputs.scope != 'ios-unit'
        run: |
          mkdir -p work/clipboard
          xcodebuild -project ios/IrisChat.xcodeproj -scheme IrisChat \
            -destination "$(./scripts/ios-simulator-destination)" \
            -parallel-testing-enabled NO \
            -only-testing:IrisChatUITests/IrisChatFlowUITests/testDeviceLinkShowsProgressAfterHistoryApproval \
            -resultBundlePath work/clipboard/ios-device-link.xcresult test

      - name: iOS native composer, clipboard, and timeline tests
        if: ${{ !cancelled() && steps.ios-build.outcome == 'success' }}
        env:
          IOS_VALIDATION_SCOPE: ${{ inputs.scope }}
          IOS_CORE_SEED_RUN: ${{ inputs.ios_core_seed_run }}
        run: |
          selectors=(-only-testing:IrisChatTests -only-testing:NotificationServiceTests)
          if [[ -n "$IOS_CORE_SEED_RUN" ]]; then
            selectors=(-only-testing:IrisChatTests/IrisProfileStoreTests -only-testing:IrisChatTests/ChatListRowLayoutTests
              -only-testing:IrisChatTests/NearbyAvatarTests/testGroupMessageSenderAvatarUpdatesInsideEquatableRow)
          fi
          if [[ "$IOS_VALIDATION_SCOPE" != ios-unit ]]; then
            selectors+=(
              -only-testing:IrisChatUITests/ComposerCompletionUITests
              -only-testing:IrisChatUITests/ChatTimelineUITests/testReopeningLongChatLandsAtBottom
              -only-testing:IrisChatUITests/IrisChatTimelineUITests/testSearchHitInSeededLongChatOpensInTimeline
              -only-testing:IrisChatUITests/ChatPaginationUITests
            )
          fi
          xcodebuild -project ios/IrisChat.xcodeproj -scheme IrisChat \
            -destination "$(./scripts/ios-simulator-destination)" \
            -parallel-testing-enabled NO \
            "${selectors[@]}" \
            -resultBundlePath work/clipboard/ios.xcresult test

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-composer-tests
          path: iris-chat-rs/work/clipboard/
          retention-days: 14

  windows-ui:
    if: ${{ inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'windows' || inputs.scope == 'windows-keyboard' }}
    name: Windows native clipboard and composer tests
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
    defaults:
      run:
        shell: pwsh
        working-directory: iris-chat-rs
    steps:
      - uses: actions/checkout@v4
        with:
          path: iris-chat-rs
      - name: Install build tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          choco install cmake nasm --no-progress -y
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: all-builds-windows-${{ hashFiles('iris-chat-rs/**/Cargo.lock', 'iris-chat-rs/windows/**/*.csproj') }}
          restore-keys: all-builds-windows-
      - name: Check Windows build input pins
        run: ./scripts/test-windows-build-inputs.ps1
      - name: Build native app
        id: native-build
        run: ./scripts/windows-build-local.ps1 build
      - name: Exercise real WPF clipboard and draft lifecycle
        if: ${{ inputs.scope != 'windows-keyboard' }}
        run: |
          dotnet run --project windows/ClipboardTests/ClipboardTests.csproj -c Release -- work/clipboard
          if ($LASTEXITCODE -ne 0) { throw 'Native clipboard tests failed' }
      - name: Exercise WPF keyboard navigation
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          dotnet run --project windows/KeyboardTests/KeyboardTests.csproj -c Release -- work/keyboard
          if ($LASTEXITCODE -ne 0) { throw 'Native keyboard tests failed' }
      - name: Exercise Windows light and dark themes
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          dotnet run --project windows/ThemeTests/ThemeTests.csproj -c Release -- work/themes
          if ($LASTEXITCODE -ne 0) { throw 'Native theme contrast tests failed' }
      - name: Exercise native direct files and WPF transfer controls
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' && (inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'windows') }}
        run: ./scripts/windows-build-local.ps1 direct-file-tests
      - name: Exercise WPF nearby avatars and chat headers
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' && (inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'windows') }}
        run: ./scripts/windows-build-local.ps1 nearby-avatar-tests
      - name: Upload Windows clipboard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-clipboard-tests
          path: |
            iris-chat-rs/work/clipboard/*.png
            iris-chat-rs/work/clipboard/*timings.json
            iris-chat-rs/work/keyboard/*.png
            iris-chat-rs/work/themes/*.png
          retention-days: 14
      - name: Upload Windows transfer and nearby results
        if: ${{ always() && (inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'windows') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-transfer-and-nearby-tests
          path: |
            iris-chat-rs/work/direct-files-ui/native-transfer.json
            iris-chat-rs/work/direct-files-ui/direct-file-states.png
            iris-chat-rs/work/nearby-avatar/windows-nearby-avatars.png
          retention-days: 14

  cli-service:
    if: ${{ inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'cli' }}
    name: CLI service (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      IRIS_DEFAULT_RELAYS: ""
      IRIS_FIPS_WEBSOCKET_SEED_URLS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cli-service-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/Cargo.lock') }}
      - name: Exercise service ownership, IPC, restart and live replies
        run: cargo test --manifest-path core/Cargo.toml --test cli_service --locked
