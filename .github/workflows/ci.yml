name: CI

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/release.yml"
      - "scripts/test_release_workflow.py"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/release.yml"
      - "scripts/test_release_workflow.py"
  workflow_dispatch:
    inputs:
      scope:
        description: Checks to run; retain exact source-bound coverage for unchanged components
        type: choice
        default: all
        options: [all, cli, core, inbound-retry, inbound-retry-release, android, windows, windows-keyboard, windows-restore, apple, ios, ios-unit, macos, linux, apple-products, ios-products, macos-products, ios-ui-runner, macos-ui-runner]
      ios_core_seed_run:
        description: Optional exact successful core build/cache producer for Swift-only unit validation
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.scope || 'all' }}-${{ inputs.ios_core_seed_run || 'full' }}
  cancel-in-progress: true

env:
  APP_DIR: iris-chat-rs
  CARGO_TERM_COLOR: always

jobs:
  inbound-retry:
    if: ${{ inputs.scope == 'inbound-retry' || inputs.scope == 'inbound-retry-release' }}
    name: ${{ inputs.scope == 'inbound-retry-release' && 'Measure optimized whole retry on unchanged source' || 'Compare exact inbound retry regression sources' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_TEST_OPT_LEVEL: '0'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '3'
      CARGO_PROFILE_RELEASE_DEBUG: '1'
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: 'false'
      DEBUGINFOD_URLS: ''
    steps:
      - name: Checkout reviewed diagnostic driver
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: retry-driver
          persist-credentials: false
      - name: Require admitted immutable regression inputs
        id: inputs
        run: python3 retry-driver/scripts/verify_inbound_retry.py preflight --mode "${{ inputs.scope == 'inbound-retry-release' && 'optimized' || 'comparison' }}" --output work/inbound-retry
      - name: Checkout first immutable diagnostic source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.scope == 'inbound-retry-release' && steps.inputs.outputs.after || steps.inputs.outputs.before }}
          fetch-depth: 2
          path: iris-chat-rs
          persist-credentials: false
      - name: Install accepted Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Restore existing core cache
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: rust-${{ runner.os }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-
      - name: Require the allocation regression to fail for its intended reason
        if: ${{ inputs.scope == 'inbound-retry' }}
        env:
          IRIS_CACHE_REQUESTED: ${{ steps.cargo-cache.outputs.cache-primary-key }}
          IRIS_CACHE_MATCHED: ${{ steps.cargo-cache.outputs.cache-matched-key }}
          IRIS_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: python3 retry-driver/scripts/verify_inbound_retry.py before --source iris-chat-rs --output work/inbound-retry
      - name: Checkout minimal fix into the same source path
        if: ${{ inputs.scope == 'inbound-retry' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.inputs.outputs.after }}
          fetch-depth: 2
          path: iris-chat-rs
          persist-credentials: false
      - name: Require allocation durability and whole-retry checks to pass
        if: ${{ inputs.scope == 'inbound-retry' }}
        run: python3 retry-driver/scripts/verify_inbound_retry.py after --source iris-chat-rs --output work/inbound-retry
      - name: Measure optimized unchanged whole retry and optionally attribute CPU failure
        if: ${{ inputs.scope == 'inbound-retry-release' }}
        env:
          IRIS_CACHE_REQUESTED: ${{ steps.cargo-cache.outputs.cache-primary-key }}
          IRIS_CACHE_MATCHED: ${{ steps.cargo-cache.outputs.cache-matched-key }}
          IRIS_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: python3 retry-driver/scripts/verify_inbound_retry.py optimized --source iris-chat-rs --output work/inbound-retry
      - name: Retain full logs and exact comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inbound-retry-${{ github.run_id }}
          path: work/inbound-retry/
          if-no-files-found: warn
          retention-days: 14

  windows-restore:
    if: ${{ inputs.scope == 'windows-restore' }}
    name: Windows restore evaluation (.NET ${{ matrix.sdk }})
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sdk: ['8.0.420', '10.0.402']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}
      - name: Evaluate and test locked Windows restore
        shell: pwsh
        run: ./scripts/test-windows-restore.ps1 -SdkVersion '${{ matrix.sdk }}' -OutputDirectory 'work/windows-restore-${{ matrix.sdk }}'
      - name: Retain restore evaluation and original outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-restore-${{ matrix.sdk }}
          path: work/windows-restore-${{ matrix.sdk }}/
          retention-days: 14

  apple-validation-products:
    if: ${{ inputs.scope == 'apple-products' || inputs.scope == 'ios-products' || inputs.scope == 'macos-products' || inputs.scope == 'ios-ui-runner' || inputs.scope == 'macos-ui-runner' }}
    uses: ./.github/workflows/apple-validation-products.yml
    with:
      commit: ${{ github.sha }}
      platform: ${{ inputs.scope == 'macos-ui-runner' && 'macos-ui' || inputs.scope == 'ios-ui-runner' && 'ios-ui' || inputs.scope == 'ios-products' && 'ios' || inputs.scope == 'macos-products' && 'macos' || 'both' }}

  rust:
    if: ${{ inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'core' }}
    name: Rust and repo checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
    defaults:
      run:
        working-directory: iris-chat-rs
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_DIR }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: rust-${{ runner.os }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Static checks
        run: |
          ./scripts/check-palettes
          ./scripts/check-no-accent-text
          ./scripts/check-source-file-sizes
          python3 scripts/test_dependency_lock_consistency.py
          ./scripts/check-rust-panics
          ./scripts/test_release_publish_guard
          ./scripts/test_homebrew_tap

      - name: Rust formatting
        run: |
          cargo fmt --manifest-path chat-protocol/Cargo.toml -- --check
          cargo fmt --manifest-path core/Cargo.toml -- --check
          cargo fmt --manifest-path protocol-ffi/Cargo.toml -- --check
          cargo fmt --manifest-path linux/Cargo.toml -- --check

      - name: Rust lint including test targets
        run: |
          for crate in core chat-protocol protocol-ffi; do
            cargo clippy --manifest-path "$crate/Cargo.toml" --locked --all-targets -- -D warnings
          done

      - name: Rust tests
        run: |
          mkdir -p work/private-controls
          IRIS_PRIVATE_CONTROL_FIXTURE_OUTPUT="$PWD/work/private-controls/native-private-controls.json" ./scripts/test_rust.sh
          test -s work/private-controls/native-private-controls.json
          git rev-parse HEAD > work/private-controls/source-commit.txt
          cd work/private-controls
          sha256sum native-private-controls.json > SHA256SUMS

      - name: Upload native private-control interoperability fixture
        uses: actions/upload-artifact@v4
        with:
          name: native-private-control-fixture
          path: iris-chat-rs/work/private-controls/
          if-no-files-found: error
          retention-days: 14

      - name: Verify protocol package
        id: protocol-package
        run: |
          cargo package --manifest-path chat-protocol/Cargo.toml --locked
          protocol_version="$(python3 -c 'import tomllib; print(tomllib.load(open("chat-protocol/Cargo.toml", "rb"))["package"]["version"])')"
          protocol_archive="iris-chat-protocol-${protocol_version}.crate"
          cd "$CARGO_TARGET_DIR/package"
          sha256sum "$protocol_archive" > protocol-package.sha256
          echo "archive=$CARGO_TARGET_DIR/package/$protocol_archive" >> "$GITHUB_OUTPUT"

      - name: Upload verified protocol package
        uses: actions/upload-artifact@v4
        with:
          name: verified-protocol-package
          path: |
            ${{ steps.protocol-package.outputs.archive }}
            ${{ github.workspace }}/cargo-target/package/protocol-package.sha256
          if-no-files-found: error
          retention-days: 14

  android:
    if: ${{ inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'android' }}
    name: Android build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
    defaults:
      run:
        working-directory: iris-chat-rs
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_DIR }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Install Android SDK components
        run: |
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$android_sdk_root" ]]; then
            echo "ANDROID_HOME or ANDROID_SDK_ROOT must be set." >&2
            exit 1
          fi
          sdkmanager_bin="$android_sdk_root/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Cache Cargo and Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ github.workspace }}/cargo-target
          key: android-${{ runner.os }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock', 'iris-chat-rs/android/**/*.gradle*', 'iris-chat-rs/android/gradle/**/*.toml') }}
          restore-keys: |
            android-${{ runner.os }}-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Assemble debug APK
        run: ./scripts/android-build android-assemble

      - name: Android unit and compile checks
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebugAndroidTest -Piris.testRunner=to.iris.chat.calls.NativeCallTestRunner
        working-directory: iris-chat-rs/android

      - name: Upload Android native test packages
        uses: actions/upload-artifact@v4
        with:
          name: android-native-test-packages
          path: |
            iris-chat-rs/android/app/build/outputs/apk/debug/*.apk
            iris-chat-rs/android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  linux:
    if: ${{ inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'linux' }}
    name: Linux build and tests (Rust ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, '1.93.1']
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
    defaults:
      run:
        working-directory: iris-chat-rs
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_DIR }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            adwaita-icon-theme \
            build-essential \
            libadwaita-1-dev \
            libclang-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libgtk-4-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav gstreamer1.0-pipewire \
            libsecret-1-dev \
            librsvg2-common \
            libsoup-3.0-dev \
            libssl-dev \
            libv4l-dev libasound2-dev nasm \
            xvfb xauth dbus-x11 \
            pkg-config

      - name: Install Rust
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component clippy
          rustup default "${{ matrix.toolchain }}"

      - name: Cache Cargo
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: linux-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            linux-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock') }}-
            linux-${{ runner.os }}-${{ matrix.toolchain }}-

      - name: Desktop media regression tests
        run: |
          cargo clippy --manifest-path core/Cargo.toml --features desktop-media --locked --lib -- -D warnings -D clippy::panic -D clippy::unwrap_used -D clippy::expect_used -D clippy::unimplemented -D clippy::todo -D clippy::indexing_slicing
          cargo test --manifest-path core/Cargo.toml --features desktop-media --locked --lib desktop_call -- --nocapture

      - name: Linux tests
        run: |
          mkdir -p work/clipboard
          IRIS_CLIPBOARD_UI_SCREENSHOT="$PWD/work/clipboard/linux.png" \
          IRIS_COMPLETION_SCREENSHOT_DIR="$PWD/work/clipboard/completion" \
          IRIS_KEYBOARD_SCREENSHOT="$PWD/work/clipboard/linux-keyboard.png" \
            dbus-run-session -- xvfb-run -a cargo test --manifest-path linux/Cargo.toml --locked --features ui-tests

      - name: Upload Linux clipboard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-clipboard-tests-${{ matrix.toolchain }}
          path: iris-chat-rs/work/clipboard/
          retention-days: 14

      - name: Retain compiled dependencies after test failures
        if: ${{ always() && !cancelled() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  macos:
    if: ${{ inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'apple' || inputs.scope == 'macos' }}
    name: macOS build and tests
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
    defaults:
      run:
        working-directory: iris-chat-rs
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_DIR }}

      - name: Install build tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
            ${{ github.workspace }}/iris-chat-rs/macos/.build/cargo-target
          key: macos-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock', 'iris-chat-rs/macos/project.yml') }}
          restore-keys: |
            macos-${{ runner.os }}-${{ runner.arch }}-

      - name: macOS tests
        run: ./scripts/test-macos

      - name: Upload macOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-composer-tests
          path: iris-chat-rs/macos/.build/DerivedData/Logs/Test/*.xcresult
          include-hidden-files: true
          retention-days: 14

  ios:
    if: ${{ inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'apple' || inputs.scope == 'ios' || inputs.scope == 'ios-unit' }}
    name: iOS simulator build and composer tests
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
    defaults:
      run:
        working-directory: iris-chat-rs
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_DIR }}

      - name: Install build tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Restore Cargo cache
        id: ios_cargo_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock', 'iris-chat-rs/ios/project.yml') }}
          restore-keys: |
            ios-${{ runner.os }}-${{ runner.arch }}-

      - name: iOS simulator build
        id: ios-build
        env:
          GH_TOKEN: ${{ github.token }}
          IOS_CORE_SEED_RUN: ${{ inputs.ios_core_seed_run }}
          IOS_CORE_CACHE_HIT: ${{ steps.ios_cargo_cache.outputs.cache-hit }}
          IOS_CORE_CACHE_KEY: ${{ steps.ios_cargo_cache.outputs.cache-primary-key }}
        run: |
          if [[ -n "$IOS_CORE_SEED_RUN" ]]; then
            test "${{ inputs.scope }}" = ios-unit
            python3 scripts/reuse_ios_core_cache.py --producer-run "$IOS_CORE_SEED_RUN"
            source scripts/build_common.sh
            load_release_env "$PWD"
            resolve_shared_build_metadata "$PWD"
            IRIS_IOS_NOTIFICATION_DEBUG_SIGNING_STYLE=Automatic \
              IRIS_IOS_NOTIFICATION_DEBUG_PROFILE_SPECIFIER= \
              sh -c 'cd ios && xcodegen generate --spec project.yml'
            xcodebuild -project ios/IrisChat.xcodeproj -scheme IrisChat \
              -destination "$(./scripts/ios-simulator-destination)" -jobs 2 build
          else
            ./scripts/ios-build ios-build-sim
          fi

      - name: Save successful iOS compiler cache
        if: steps.ios_cargo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: ${{ steps.ios_cargo_cache.outputs.cache-primary-key }}

      - name: iOS device linking progress test
        if: inputs.scope != 'ios-unit'
        run: |
          mkdir -p work/clipboard
          xcodebuild -project ios/IrisChat.xcodeproj -scheme IrisChat \
            -destination "$(./scripts/ios-simulator-destination)" \
            -parallel-testing-enabled NO \
            -only-testing:IrisChatUITests/IrisChatFlowUITests/testDeviceLinkShowsProgressAfterHistoryApproval \
            -resultBundlePath work/clipboard/ios-device-link.xcresult test

      - name: iOS native composer, clipboard, and timeline tests
        if: ${{ !cancelled() && steps.ios-build.outcome == 'success' }}
        env:
          IOS_VALIDATION_SCOPE: ${{ inputs.scope }}
          IOS_CORE_SEED_RUN: ${{ inputs.ios_core_seed_run }}
        run: |
          selectors=(-only-testing:IrisChatTests -only-testing:NotificationServiceTests)
          if [[ -n "$IOS_CORE_SEED_RUN" ]]; then
            selectors=(-only-testing:IrisChatTests/IrisProfileStoreTests -only-testing:IrisChatTests/ChatListRowLayoutTests
              -only-testing:IrisChatTests/NearbyAvatarTests/testGroupMessageSenderAvatarUpdatesInsideEquatableRow)
          fi
          if [[ "$IOS_VALIDATION_SCOPE" != ios-unit ]]; then
            selectors+=(
              -only-testing:IrisChatUITests/ComposerCompletionUITests
              -only-testing:IrisChatUITests/ChatTimelineUITests/testReopeningLongChatLandsAtBottom
              -only-testing:IrisChatUITests/IrisChatTimelineUITests/testSearchHitInSeededLongChatOpensInTimeline
              -only-testing:IrisChatUITests/ChatPaginationUITests
            )
          fi
          xcodebuild -project ios/IrisChat.xcodeproj -scheme IrisChat \
            -destination "$(./scripts/ios-simulator-destination)" \
            -parallel-testing-enabled NO \
            "${selectors[@]}" \
            -resultBundlePath work/clipboard/ios.xcresult test

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-composer-tests
          path: iris-chat-rs/work/clipboard/
          retention-days: 14

  windows-ui:
    if: ${{ inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'windows' || inputs.scope == 'windows-keyboard' }}
    name: Windows native clipboard and composer tests
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
    defaults:
      run:
        shell: pwsh
        working-directory: iris-chat-rs
    steps:
      - uses: actions/checkout@v4
        with:
          path: iris-chat-rs
      - name: Install build tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          choco install cmake nasm --no-progress -y
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: all-builds-windows-${{ hashFiles('iris-chat-rs/**/Cargo.lock', 'iris-chat-rs/windows/**/*.csproj') }}
          restore-keys: all-builds-windows-
      - name: Check Windows build input pins
        run: ./scripts/test-windows-build-inputs.ps1
      - name: Build native app
        id: native-build
        run: ./scripts/windows-build-local.ps1 build
      - name: Exercise real WPF clipboard and draft lifecycle
        if: ${{ inputs.scope != 'windows-keyboard' }}
        run: |
          dotnet run --project windows/ClipboardTests/ClipboardTests.csproj -c Release -- work/clipboard
          if ($LASTEXITCODE -ne 0) { throw 'Native clipboard tests failed' }
      - name: Exercise WPF keyboard navigation
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          dotnet run --project windows/KeyboardTests/KeyboardTests.csproj -c Release -- work/keyboard
          if ($LASTEXITCODE -ne 0) { throw 'Native keyboard tests failed' }
      - name: Exercise Windows light and dark themes
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: |
          dotnet run --project windows/ThemeTests/ThemeTests.csproj -c Release -- work/themes
          if ($LASTEXITCODE -ne 0) { throw 'Native theme contrast tests failed' }
      - name: Exercise native direct files and WPF transfer controls
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' && (inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'windows') }}
        run: ./scripts/windows-build-local.ps1 direct-file-tests
      - name: Exercise WPF nearby avatars and chat headers
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' && (inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'windows') }}
        run: ./scripts/windows-build-local.ps1 nearby-avatar-tests
      - name: Upload Windows clipboard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-clipboard-tests
          path: |
            iris-chat-rs/work/clipboard/*.png
            iris-chat-rs/work/clipboard/*timings.json
            iris-chat-rs/work/keyboard/*.png
            iris-chat-rs/work/themes/*.png
          retention-days: 14
      - name: Upload Windows transfer and nearby results
        if: ${{ always() && (inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'windows') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-transfer-and-nearby-tests
          path: |
            iris-chat-rs/work/direct-files-ui/native-transfer.json
            iris-chat-rs/work/direct-files-ui/direct-file-states.png
            iris-chat-rs/work/nearby-avatar/windows-nearby-avatars.png
          retention-days: 14

  cli-service:
    if: ${{ inputs.scope == '' || inputs.scope == 'all' || inputs.scope == 'cli' }}
    name: CLI service (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      IRIS_DEFAULT_RELAYS: ""
      IRIS_FIPS_WEBSOCKET_SEED_URLS: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cli-service-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('core/Cargo.lock') }}
      - name: Exercise service ownership, IPC, restart and live replies
        run: cargo test --manifest-path core/Cargo.toml --test cli_service --locked
