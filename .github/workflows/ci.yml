name: iOS welcome navigation diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-welcome-diagnosis-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: iris-chat-rs
  CARGO_TERM_COLOR: always

jobs:
  ios:
    name: Focused welcome navigation and timeline
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
    defaults:
      run:
        working-directory: iris-chat-rs
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: ${{ env.APP_DIR }}

      - name: Install build tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Restore Cargo cache
        id: ios_cargo_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock', 'iris-chat-rs/ios/project.yml') }}
          restore-keys: |
            ios-${{ runner.os }}-${{ runner.arch }}-

      - name: iOS simulator build
        run: ./scripts/ios-build ios-build-sim

      - name: Save successful iOS compiler cache
        if: steps.ios_cargo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: ${{ steps.ios_cargo_cache.outputs.cache-primary-key }}

      - name: Repeat welcome and timeline navigation through real controls
        run: |
          mkdir -p work/clipboard
          xcodebuild -project ios/IrisChat.xcodeproj -scheme IrisChat \
            -destination "$(./scripts/ios-simulator-destination)" \
            -parallel-testing-enabled NO \
            -test-iterations 3 \
            -only-testing:IrisChatUITests/ChatTimelineUITests/testReopeningLongChatLandsAtBottom \
            -only-testing:IrisChatUITests/OptionalProfileNameUITests \
            -resultBundlePath work/clipboard/ios-welcome.xcresult test

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-welcome-navigation-tests
          path: iris-chat-rs/work/clipboard/
          retention-days: 14
