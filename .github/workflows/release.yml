name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v2026.7.22."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: iris-chat-rs
    outputs:
      sha: ${{ steps.release_commit.outputs.sha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          path: iris-chat-rs

      - name: Validate tag and release notes
        id: release_commit
        run: |
          set -Eeuo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]{4}\.[1-9][0-9]?\.[1-9][0-9]?(\.[1-9][0-9]?)?$ ]]; then
            echo "::error::Unsupported release tag: $RELEASE_TAG"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
            echo "::error::Release tag does not exist: $RELEASE_TAG"
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "::error::Release tags must be annotated: $RELEASE_TAG"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]]; then
            echo "::error::Checkout does not match $RELEASE_TAG"
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$RELEASE_TAG does not point to a commit from main"
            exit 1
          fi

          scripts/render-release-notes.py \
            --channel validate \
            --tag "$RELEASE_TAG" \
            --notes RELEASE_NOTES.md

          python3 scripts/validate-haps-manifest.py --tag "$RELEASE_TAG"

          if [[ -f release-platforms.json ]]; then
            scripts/release-manifest.py list-assets --tag "$RELEASE_TAG" >/dev/null
          fi

          source scripts/build_common.sh
          semantic_version_code "${RELEASE_TAG#v}" >/dev/null || {
            echo "::error::The tag cannot be converted to a shared app version code"
            exit 1
          }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check shared Rust formatting before builds
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -Eeuo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo +stable fmt --manifest-path chat-protocol/Cargo.toml --check
          cargo +stable fmt --manifest-path core/Cargo.toml --check
          cargo +stable fmt --manifest-path protocol-ffi/Cargo.toml --check

  verify:
    name: Verify release core gate
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
    defaults:
      run:
        working-directory: iris-chat-rs
    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.sha }}
          path: iris-chat-rs

      - name: Install Rust and native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libdbus-1-dev pkg-config
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ github.workspace }}/cargo-target
          key: rust-${{ runner.os }}-${{ hashFiles('iris-chat-rs/**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Run hosted release gate
        run: |
          set -Eeuo pipefail
          python3 scripts/test_release_notes.py
          mkdir -p work/private-controls
          IRIS_PRIVATE_CONTROL_FIXTURE_OUTPUT="$PWD/work/private-controls/native-private-controls.json" scripts/verify.sh fast
          scripts/test_release_publish_guard
          scripts/test_homebrew_tap

      - name: Upload populated discovery CPU and privacy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: populated-discovery-cpu-and-privacy
          path: iris-chat-rs/work/private-controls/
          if-no-files-found: warn
          retention-days: 14

  mesh-resource:
    name: Relayless recovery and resource budgets
    needs: validate
    uses: irislib/iris-stack/.github/workflows/product-lab.yml@e34fa190b41a3ced5148e92b103418004bdd0b65
    with:
      lab_rev: e34fa190b41a3ced5148e92b103418004bdd0b65
      chat_rev: ${{ needs.validate.outputs.sha }}
      drive_rev: 7cb74966ddaecf90fb91b8f36a44ecc4bbda7b02
      htree_version: 0.2.148

  build:
    name: Build release artifacts
    needs: validate
    uses: ./.github/workflows/build-artifacts.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      artifact_retention_days: 7
      sign_macos: true
    secrets: inherit

  release:
    name: Create GitHub release
    needs:
      - validate
      - verify
      - build
      - mesh-resource
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: iris-*-${{ needs.build.outputs.artifact_suffix }}
          path: artifacts
          merge-multiple: true

      - name: Create immutable release manifest
        run: |
          set -Eeuo pipefail
          scripts/release-manifest.py create \
            --tag "$RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)" \
            --asset-dir artifacts \
            --out "artifacts/iris-chat-${RELEASE_TAG}-manifest.json"

      - name: Render release notes
        run: |
          scripts/render-release-notes.py \
            --channel github \
            --tag "$RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)" \
            --asset-dir artifacts \
            --asset-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            --notes RELEASE_NOTES.md \
            --out release-notes.md

      - name: Attest release build provenance
        uses: actions/attest@v4
        with:
          subject-path: artifacts/*

      - name: Inspect existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if release_json="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isImmutable 2>/dev/null)"; then
            if [[ "$(jq -r '.isImmutable' <<<"$release_json")" != "true" ]]; then
              echo "::error::An existing mutable release blocks $RELEASE_TAG"
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Iris Chat ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          files: artifacts/*

      - name: Verify immutable release and exact assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          immutable="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isImmutable \
            --jq .isImmutable)"
          if [[ "$immutable" != "true" ]]; then
            echo "::error::$RELEASE_TAG was not published as an immutable GitHub Release"
            exit 1
          fi

          verified=0
          for _ in {1..12}; do
            if gh release verify "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              verified=1
              break
            fi
            sleep 5
          done
          if [[ "$verified" -ne 1 ]]; then
            echo "::error::GitHub did not produce a valid release attestation for $RELEASE_TAG"
            exit 1
          fi

          for asset in artifacts/*; do
            gh release verify-asset "$RELEASE_TAG" "$asset" \
              --repo "$GITHUB_REPOSITORY" >/dev/null
          done
