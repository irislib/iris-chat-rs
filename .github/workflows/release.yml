name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v2026.7.22."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify release inputs and core gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate tag and release notes
        run: |
          set -Eeuo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]{4}\.[1-9][0-9]?\.[1-9][0-9]?(\.[1-9][0-9]?)?$ ]]; then
            echo "::error::Unsupported release tag: $RELEASE_TAG"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
            echo "::error::Release tag does not exist: $RELEASE_TAG"
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "::error::Release tags must be annotated: $RELEASE_TAG"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]]; then
            echo "::error::Checkout does not match $RELEASE_TAG"
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$RELEASE_TAG does not point to a commit from main"
            exit 1
          fi

          scripts/render-release-notes.py \
            --channel validate \
            --tag "$RELEASE_TAG" \
            --notes RELEASE_NOTES.md

          source scripts/build_common.sh
          semantic_version_code "${RELEASE_TAG#v}" >/dev/null || {
            echo "::error::The tag cannot be converted to a shared app version code"
            exit 1
          }

      - name: Install Rust and native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: release-gate-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-gate-${{ runner.os }}-

      - name: Run hosted release gate
        run: |
          set -Eeuo pipefail
          python3 scripts/test_release_notes.py
          scripts/verify.sh fast
          scripts/test_release_publish_guard
          scripts/test_homebrew_tap

  build:
    name: Build release artifacts
    needs: verify
    uses: ./.github/workflows/build-artifacts.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      artifact_retention_days: 7
      sign_macos: true
    secrets: inherit

  release:
    name: Create GitHub release
    needs:
      - verify
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create immutable release manifest
        run: |
          set -Eeuo pipefail
          scripts/release-manifest.py create \
            --tag "$RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)" \
            --asset-dir artifacts \
            --out "artifacts/iris-chat-${RELEASE_TAG}-manifest.json"

      - name: Render release notes
        run: |
          scripts/render-release-notes.py \
            --channel github \
            --tag "$RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)" \
            --asset-dir artifacts \
            --asset-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            --notes RELEASE_NOTES.md \
            --out release-notes.md

      - name: Attest release build provenance
        uses: actions/attest@v4
        with:
          subject-path: artifacts/*

      - name: Inspect existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if release_json="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isImmutable 2>/dev/null)"; then
            if [[ "$(jq -r '.isImmutable' <<<"$release_json")" != "true" ]]; then
              echo "::error::An existing mutable release blocks $RELEASE_TAG"
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.existing.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Iris Chat ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          files: artifacts/*

      - name: Verify immutable release and exact assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          immutable="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isImmutable \
            --jq .isImmutable)"
          if [[ "$immutable" != "true" ]]; then
            echo "::error::$RELEASE_TAG was not published as an immutable GitHub Release"
            exit 1
          fi

          verified=0
          for _ in {1..12}; do
            if gh release verify "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              verified=1
              break
            fi
            sleep 5
          done
          if [[ "$verified" -ne 1 ]]; then
            echo "::error::GitHub did not produce a valid release attestation for $RELEASE_TAG"
            exit 1
          fi

          for asset in artifacts/*; do
            gh release verify-asset "$RELEASE_TAG" "$asset" \
              --repo "$GITHUB_REPOSITORY" >/dev/null
          done
