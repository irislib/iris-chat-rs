# https://haps.hashtree.cc
# Local source builds are separate from the signed, attested release binaries.
# Keep both package versions and build version arguments in sync with the release tag.
# v2026.10.25.3 uses Haps' date-revision version 2026.10.2503.
# Haps binds the source URL and exact commit from the selected release.

[package]
name = "iris-chat"
version = "2026.10.2503"
target = "host"
description = "Private messaging without a phone number."

# Requires the macOS build tools documented in README.md.
# This builds an unsigned local app; it does not notarize, install, or launch it.
[targets.aarch64-apple-darwin.package]
commands = { iris-chat = "Iris Chat.app/Contents/MacOS/Iris Chat" }
app = "Iris Chat.app"

[targets.aarch64-apple-darwin.build]
commands = [["env", "IRIS_APP_VERSION_NAME=2026.10.25.3", "IRIS_RELEASE_ENV_FILE=/dev/null", "MACOS_SIGNING_IDENTITY=", "IRIS_MACOS_APP_NAME=Iris Chat.app", "IRIS_MACOS_RUST_TARGETS={target}", "CARGO_TARGET_DIR=target/haps-core", "./scripts/macos-build", "macos-app"]]
artifacts = { "Iris Chat.app" = "dist/macos/Iris Chat.app" }

# Requires the native development libraries listed in linux/Dockerfile.
[targets.x86_64-unknown-linux-gnu.package]
commands = { iris-chat = "usr/bin/iris-chat" }
desktop = { name = "Iris Chat", command = "iris-chat", icon = "usr/share/icons/hicolor/256x256/apps/iris-chat.png" }

[targets.x86_64-unknown-linux-gnu.build]
commands = [["env", "IRIS_APP_VERSION_NAME=2026.10.25.3", "cargo", "build", "--manifest-path", "linux/Cargo.toml", "--locked", "--release", "--bin", "iris-chat", "--target", "{target}", "--target-dir", "target/haps-linux"]]

[targets.x86_64-unknown-linux-gnu.build.artifacts]
"usr/bin/iris-chat" = "target/haps-linux/{target}/release/iris-chat"
"usr/share/applications/to.iris.chat.desktop" = "linux/resources/iris-chat.desktop"
"usr/share/dbus-1/services/to.iris.chat.service" = "linux/resources/to.iris.chat.service"
"usr/share/doc/iris-chat/DESKTOP_MEDIA_LICENSES.txt" = "DESKTOP_MEDIA_LICENSES.txt"
"usr/share/icons/hicolor/16x16/apps/iris-chat.png" = "linux/resources/iris-chat-16.png"
"usr/share/icons/hicolor/22x22/apps/iris-chat.png" = "linux/resources/iris-chat-22.png"
"usr/share/icons/hicolor/24x24/apps/iris-chat.png" = "linux/resources/iris-chat-24.png"
"usr/share/icons/hicolor/32x32/apps/iris-chat.png" = "linux/resources/iris-chat-32.png"
"usr/share/icons/hicolor/48x48/apps/iris-chat.png" = "linux/resources/iris-chat-48.png"
"usr/share/icons/hicolor/64x64/apps/iris-chat.png" = "linux/resources/iris-chat-64.png"
"usr/share/icons/hicolor/128x128/apps/iris-chat.png" = "linux/resources/iris-chat-128.png"
"usr/share/icons/hicolor/256x256/apps/iris-chat.png" = "linux/resources/iris-chat-256.png"
"usr/share/icons/hicolor/512x512/apps/iris-chat.png" = "linux/resources/iris-chat-512.png"

[targets.x86_64-pc-windows-msvc.package]
commands = { iris-chat = "IrisChat.exe" }
desktop = { name = "Iris Chat", command = "iris-chat", icon = "Resources/IrisChat.ico" }

# Requires PowerShell, the Windows build tools in windows/README.md, and Haps 0.1.20.
# The root directory mapping preserves the published Windows package layout.
[targets.x86_64-pc-windows-msvc.build]
commands = [["pwsh", "-NoProfile", "-NonInteractive", "-Command", "$ErrorActionPreference = 'Stop'; $env:IRIS_APP_VERSION_NAME = '2026.10.25.3'; $env:IRIS_APP_VERSION_CODE = '2026102503'; $env:IRIS_BUILD_GIT_SHA = git rev-parse --short=12 HEAD; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $env:IRIS_WINDOWS_TARGET = '{target}'; $env:IRIS_WINDOWS_DOTNET_CONFIG = 'Release'; $env:IRIS_WINDOWS_RUST_PROFILE = 'release'; $env:CARGO_TARGET_DIR = 'target/haps-core'; & ./scripts/windows-build-local.ps1 build; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }"]]
artifacts = { "." = "windows/IrisChat/bin/Release/net8.0-windows10.0.17763.0/win-x64/publish" }

[packages.iris.package]
name = "iris"
version = "2026.10.2503"
target = "host"
description = "Iris Chat command-line client"
commands = { iris = "iris" }

# Native source builds need Rust, CMake, and the platform C/C++ dependencies.
[packages.iris.targets.aarch64-apple-darwin.build]
commands = [["env", "IRIS_APP_VERSION_NAME=2026.10.25.3", "cargo", "build", "--manifest-path", "core/Cargo.toml", "--locked", "--release", "--bin", "iris", "--target", "{target}", "--target-dir", "target/haps-cli"]]
artifacts = { iris = "target/haps-cli/{target}/release/iris" }

[packages.iris.targets.x86_64-apple-darwin.build]
commands = [["env", "IRIS_APP_VERSION_NAME=2026.10.25.3", "cargo", "build", "--manifest-path", "core/Cargo.toml", "--locked", "--release", "--bin", "iris", "--target", "{target}", "--target-dir", "target/haps-cli"]]
artifacts = { iris = "target/haps-cli/{target}/release/iris" }

[packages.iris.targets.x86_64-unknown-linux-gnu.build]
commands = [["env", "IRIS_APP_VERSION_NAME=2026.10.25.3", "cargo", "build", "--manifest-path", "core/Cargo.toml", "--locked", "--release", "--bin", "iris", "--target", "{target}", "--target-dir", "target/haps-cli"]]
artifacts = { iris = "target/haps-cli/{target}/release/iris" }
